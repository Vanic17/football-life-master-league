name: Adapter release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build adapter-only update
        run: python football-life/test_update_manager.py
      - name: Package adapter-only update
        run: python build_release.py "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/FL26-adapter-update.zip "Aggiorna Master League FL26.cmd" --title "$GITHUB_REF_NAME" --generate-notes
